<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 8px;
            overflow: hidden;
            background-color: transparent;
            box-sizing: border-box;
        }

        /* The display size is set in OBS's Browser Source Properties
           (Width/Height). This container fills 100% of the space given
           to it — adjust the source's dimensions in OBS to match the
           space available in your scene. */
        #chat-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 5px;
            box-sizing: border-box;
        }

        :root {
            --color-normal: #ffb648;
            --color-crit: #2ee673;
            --color-fail: #ff4d5e;
            --color-text: #f2f2f2;
            --color-text-muted: #a0a0a5;
            --color-bg: rgba(20, 20, 22, 0.92);
        }

        .message {
            --color-event: var(--color-normal);
            font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
            background-color: var(--color-bg);
            border-left: 3px solid var(--color-event);
            border-radius: 5px;
            padding: 7px 10px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
            animation: appear 0.3s ease-out forwards;
            flex-shrink: 0;
        }

        .message.event-critical { --color-event: var(--color-crit); }
        .message.event-fail { --color-event: var(--color-fail); }

        .header-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 2px;
        }

        .dice-icon {
            font-size: 13px;
            line-height: 1;
        }

        .player {
            font-weight: 700;
            font-size: 12px;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .main-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .skill {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .final-value {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--color-event);
            line-height: 1;
        }

        .secondary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 3px;
            gap: 6px;
        }

        .target {
            font-size: 12px;
            color: var(--color-text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            font-size: 11px;
            font-weight: 700;
            color: var(--color-event);
            border: 1px solid var(--color-event);
            border-radius: 20px;
            padding: 1px 7px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .rollem-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            color: var(--color-text);
        }

        .highlight-number {
            color: var(--color-event);
            font-weight: 700;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const maxMessages = 6; // Number of roll cards kept visible on screen at once.

        const rollSounds = ['diceroll1.mp3', 'diceroll2.mp3', 'diceroll3.mp3'];

        /**
         * Plays an audio file and resolves the Promise once playback ends
         * (or fails) — this guarantees the audio queue never gets stuck if
         * the file is missing or invalid.
         */
        function playSound(src, volume) {
            return new Promise((resolve) => {
                const audio = new Audio(src);
                audio.volume = volume;
                const finish = () => resolve();
                audio.addEventListener('ended', finish, { once: true });
                audio.addEventListener('error', () => {
                    console.warn(`[overlay] Couldn't load audio file: ${src}`);
                    finish();
                }, { once: true });
                audio.play().catch((err) => {
                    console.warn(`[overlay] play() blocked/rejected for ${src}:`, err);
                    finish();
                });
            });
        }

        /**
         * Plays the roll sound (randomly picked among the available
         * variations) and, right after, the critical-success or fumble
         * sound, if that applies to the received event.
         */
        async function playAudioSequence(eventKind) {
            const rollSound = rollSounds[Math.floor(Math.random() * rollSounds.length)];
            await playSound(rollSound, 0.8);

            if (eventKind === 'crit') {
                await playSound('crit.mp3', 0.9);
            } else if (eventKind === 'fail') {
                await playSound('falhacrit.mp3', 0.9);
            }
        }

        function escapeHtml(text) {
            if (text === undefined || text === null) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function eventClass(eventKind) {
            if (eventKind === 'crit') return 'event-critical';
            if (eventKind === 'fail') return 'event-fail';
            return '';
        }

        function renderMessage(data) {
            const div = document.createElement('div');
            div.className = `message ${eventClass(data.event)}`.trim();

            if (data.type === 'command') {
                // Structured message coming from /roll: skill, target and
                // status as separate fields, with no parentheses or arrows
                // embedded in the text.
                const advantageSuffix = data.advantage ? ` · ${escapeHtml(data.advantage)}` : '';
                div.innerHTML = `
                    <div class="header-row">
                        <span class="dice-icon">🎲</span>
                        <span class="player">${escapeHtml(data.player)}</span>
                    </div>
                    <div class="main-row">
                        <span class="skill">${escapeHtml(data.skill)}</span>
                        <span class="final-value">${escapeHtml(data.value)}</span>
                    </div>
                    <div class="secondary-row">
                        <span class="target">Target ${escapeHtml(data.target)}${advantageSuffix}</span>
                        <span class="status">${escapeHtml(data.status)}</span>
                    </div>
                `;
            } else {
                // Raw message from the "rollem" bot: strips Discord
                // formatting and highlights the numbers, keeping the same
                // visual layout as the structured card.
                const cleanText = (data.result || '').replace(/[*_~`]/g, '');
                const formattedText = escapeHtml(cleanText).replace(/([0-9]+)/g, '<span class="highlight-number">$1</span>');
                div.innerHTML = `
                    <div class="header-row">
                        <span class="dice-icon">🎲</span>
                        <span class="player">${escapeHtml(data.player)}</span>
                    </div>
                    <div class="rollem-text">${formattedText}</div>
                `;
            }

            chatContainer.appendChild(div);
            if (chatContainer.children.length > maxMessages) {
                chatContainer.removeChild(chatContainer.firstChild);
            }
        }

        function connect() {
            // Replace this address with your own bot server's address
            // (see the README — use ws:// for local, wss:// for a hosted
            // server such as Render).
            const ws = new WebSocket('wss://coc-bot-nj88.onrender.com');

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.type === 'history') {
                    // Backlog of rolls that happened while the overlay was
                    // disconnected. Renders each one to recover what was
                    // missed, but without playing the sounds again (otherwise
                    // they'd all play at once on reconnect).
                    data.events.forEach(renderMessage);
                    return;
                }

                renderMessage(data);
                playAudioSequence(data.event);
            };

            ws.onclose = () => {
                setTimeout(connect, 2000);
            };
        }

        connect();
    </script>
</body>
</html>
